/* The previews deliberately show the choices, independent of the active theme. */
.theme-picker{padding:0;margin:0 0 22px;border:0;min-width:0}
.theme-picker legend,.contrast-label{font-size:12px!important;font-weight:600;color:var(--ink)!important;margin-bottom:11px!important}
.theme-options{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.theme-option{position:relative;display:flex;flex-direction:column;align-items:center;gap:9px;cursor:pointer;border:1px solid var(--line);border-radius:13px;padding:10px 8px 12px;color:var(--secondary);font-size:12px;background:var(--paper)}
.theme-option:has(input:checked){border-color:var(--teal);box-shadow:0 0 0 1px var(--teal);color:var(--ink);font-weight:600;background:var(--teal-soft)}
.theme-option:focus-within{outline:3px solid var(--focus);outline-offset:3px}
.theme-option input{position:absolute;top:9px;left:9px;margin:0;width:14px;height:14px;z-index:2;accent-color:var(--teal)}
.theme-preview{width:100%;height:61px;border-radius:7px;background:#eff4f0;border:1px solid #c4d1c7;position:relative;overflow:hidden;display:block}
.theme-preview i{position:absolute;left:0;top:0;bottom:0;width:27%;background:#dfeae2;border-right:1px solid #b7c8bd}
.theme-preview b{position:absolute;left:36%;top:13px;width:48%;height:6px;border-radius:3px;background:#2b5e48}
.theme-preview em{position:absolute;left:36%;top:27px;width:53%;height:21px;border-radius:4px;background:#fff;border:1px solid #c4d1c7}
.preview-dark{background:#142119;border-color:#435c4c}.preview-dark i{background:#263a2d;border-color:#435c4c}.preview-dark b{background:#b4dfc2}.preview-dark em{background:#263a2d;border-color:#435c4c}
.preview-system{background:linear-gradient(90deg,#eff4f0 50%,#142119 50%)}.preview-system i{background:#dfeae2}.preview-system b{background:linear-gradient(90deg,#2b5e48 30%,#b4dfc2 30%)}.preview-system em{background:linear-gradient(90deg,#fff 27%,#263a2d 27%);border-color:#718c79}
.contrast-select{width:100%;font-size:13px;background:var(--paper);color:var(--ink)}
.appearance-description{font-size:11px!important;color:var(--secondary)!important;line-height:1.7!important;margin-top:10px!important;margin-bottom:12px!important}
.appearance-current{display:flex;align-items:center;gap:8px;font-size:11px;padding:10px 0;color:var(--secondary)}
.appearance-section-title{margin-top:20px!important;padding-top:17px;border-top:1px solid var(--line)}
@media(max-width:720px){.contrast-select{font-size:16px}.theme-options{gap:7px}.theme-option{padding-left:6px;padding-right:6px}.theme-preview{height:57px}}
@media(prefers-reduced-transparency:reduce){.glass,.collection-tray{background:var(--chrome);border-color:var(--line)}}
@media(forced-colors:active){.theme-option:has(input:checked){outline:2px solid Highlight}.theme-preview{forced-color-adjust:none}.nav-item.active{outline:1px solid Highlight}.theme-option input{forced-color-adjust:auto}}
:root[data-contrast="high"] .source-row.disabled{opacity:1}
</style>

function quote(d,f){const lines=d.text.split('\n');let offset=0;return lines.map((line,i)=>{const a=f?Math.max(0,f.start-offset):0,b=f?Math.min(line.length,f.end-offset):0;const s=f&&a<b?esc(line.slice(0,a))+'<mark>'+esc(line.slice(a,b))+'</mark>'+esc(line.slice(b)):esc(line);offset+=line.length+1;return '<span class="line-number">'+(i+1)+'</span>'+s;}).join('\n');}

function renderInspector(){const el=$('inspector'),shell=$('content-shell');el.hidden=!selected;shell.classList.toggle('inspect-open',!!selected);syncInspectorMode();if(!selected)return;if(selected.type==='source'){renderSourceInspector();refreshLens(true);return;}const f=family(selected.id);if(!f){selected=null;renderInspector();return;}const all=E.activeFacts(state,f.id,true),active=E.activeFacts(state,f.id),current=all.find(v=>v.id===selected.fact)||M.chosen(state,f.id)||all[0],d=source(current.source),st=M.status(state,f.id);selected.fact=current.id;$('inspector-label').textContent='Material · '+all.length+' source appearance'+(all.length===1?'':'s');const groups=[...new Set(all.map(e=>e.text))].map(text=>all.filter(e=>e.text===text));const related=state.families.filter(x=>x.id!==f.id&&x.tags.some(t=>f.tags.includes(t))&&E.activeFacts(state,x.id).length).slice(0,4);
 const variantHTML=groups.map(group=>{const preferred=group.find(v=>v.id===state.preferred[f.id]),candidate=preferred&&!source(preferred.source).disabled&&!source(preferred.source).queued?preferred:group.filter(v=>!source(v.source).disabled&&!source(v.source).queued).sort((a,b)=>source(b.source).date.localeCompare(source(a.source).date))[0];return `<div class="variant ${preferred?'preferred':''}"><div class="meta"><span>${group.length===1?'One source':group.length+' source appearances'}</span>${preferred?'<span>✓ Your choice</span>':''}</div><p>${esc(group[0].text)}</p><div class="variant-actions">${group.map(v=>`<button class="text-button" data-action="view-variant" data-fact="${v.id}" title="${esc(source(v.source).path)}">${esc(basename(source(v.source).path))}${source(v.source).disabled?' (disabled)':''}</button>`).join('')}</div><div class="spread" style="margin-top:10px"><button class="button small ${preferred?'selected':'secondary'}" data-action="prefer" data-id="${f.id}" data-fact="${candidate?.id||''}" ${candidate&&!f.queued?'':'disabled'}>${icon(preferred?'check':'plus')}${preferred?'Preferred wording':'Use this wording'}</button></div></div>`;}).join('');
 $('inspector-content').innerHTML=`<div class="row-type ${rowColor(f)}" style="margin-bottom:16px">${icon('collection')}</div><h2 class="inspector-heading">${esc(f.title)}</h2>${statusBadge(f.id)}<div class="inspector-tags">${f.tags.map(t=>`<button data-action="query-tag" data-tag="${t}">${esc(t)}</button>`).join('')}</div><div class="inspector-primary-actions"><button class="button secondary small" data-action="collect" data-id="${f.id}" ${p().id&&!f.queued?'':'disabled'}>${icon(p().ids.includes(f.id)?'check':'plus')}${p().ids.includes(f.id)?'In this project · remove':'Add to project'}</button><button class="icon-button" data-action="copy-piece" data-id="${f.id}" data-fact="${current.id}" aria-label="Copy block" title="Copy block">${icon('copy')}</button><button class="icon-button" data-action="item-actions" data-type="family" data-id="${f.id}" aria-label="Material actions" title="Material actions">${icon('more')}</button></div>${f.queued?'<div class="info-strip warning">This piece is in Removals. Restore it to use it again.</div>':''}${st==='review'?'<div class="decision-alert"><strong>Choose the wording to carry forward</strong>These versions disagree. Check their context; your choice will be used wherever this material is collected.</div>':st==='unavailable'?'<div class="decision-alert"><strong>A source is unavailable</strong>Your preference is preserved. Re-enable its source or explicitly choose another active version.</div>':''}<section class="inspect-section"><div class="inspect-label"><span>IN THE ORIGINAL CONTEXT</span><span>${state.preferred[f.id]===current.id?'Your choice':selected.fact?'Viewing':''}</span></div>${sourceCard(d,current)}</section><section class="inspect-section"><div class="inspect-label"><span>${groups.length>1?'COMPARE WORDING':'SOURCE APPEARANCES'}</span><span>${groups.length} wording${groups.length===1?'':'s'}</span></div>${variantHTML}${state.preferred[f.id]?`<button class="text-button" data-action="clear-preference" data-id="${f.id}" function renderSourceInspector(){const d=source(selected.id);if(!d){closeInspector();return;}const facts=state.facts.filter(f=>f.source===d.id),ids=[...new Set(facts.map(f=>f.family))],projects=state.projects.filter(pr=>pr.ids.some(id=>ids.includes(id)));$('inspector-label').textContent='Source file';$('inspector-content').innerHTML=`<div class="row-type blue" style="margin-bottom:16px">${icon('file')}</div><h2 class="inspector-heading">${esc(basename(d.path))}</h2><div class="inspector-primary-actions"><button class="button secondary small" data-action="copy-source" data-source="${d.id}">${icon('copy')}Copy document</button><button class="icon-button" data-action="item-actions" data-type="source" data-id="${d.id}" aria-label="Document actions" title="Document actions">${icon('more')}</button></div>${d.archived?'<p class="badge neutral">Archived · existing links are kept</p>':''}${d.queued?'<p class="badge unavailable">In Removals</p>':''}<div class="source-path">${esc(d.path)}</div><p class="inspector-intro">${d.imported?'Imported in this browser':'Fictional sample document'} · ${d.date}<br>${d.text.length.toLocaleString()} characters · ${facts.length} excerpts</p>${sourceMeta(d)}<span class="badge ${d.disabled?'unavailable':'ready'}">${d.disabled?'Disabled':'Available to your library'}</span><section class="inspect-section"><div class="inspect-label">FULL SOURCE</div>${sourceCard(d)}</section><section class="inspect-section"><div class="inspect-label">MATERIAL FROM THIS FILE</div>${ids.map(id=>`<button class="related-item" data-action="inspect" data-id="${id}" data-fact="${facts.find(f=>f.family===id).id}">${esc(family(id).title)}<small>${statusBadge(id)}</small></button>`).join('')}</section><section class="inspect-section"><div class="inspect-label">DEPENDENCIES</div><p class="inspector-intro">${projects.length?projects.length+' project'+(projects.length===1?'':'s')+' use material from this source.':'No project currently uses this source.'}</p>${projects.map(pr= function sourceMeta(d){if(!d.imported)return '';const fmtBytes=n=>n==null?'unknown':n<1024?n+' B':n<1048576?(n/1024).toFixed(1)+' KB':(n/1048576).toFixed(1)+' MB';const rows=[['Format',(d.format||'txt').toUpperCase()+(d.pages?' · '+d.pages.length+' pages':'')],['File size',fmtBytes(d.size)],['File modified',d.modified?new Date(d.modified).toLocaleString():'unknown'],['Imported',d.importedAt?new Date(d.importedAt).toLocaleString():d.date],['Content hash',d.byteHash?d.byteHash.slice(0,16)+'…':'not recorded']];const prev=d.supersedes&&source(d.supersedes),next=d.supersededBy&&source(d.supersededBy);return `<dl class="source-meta">${rows.map(([k,v])=>`<dt>${k}</dt><dd>${esc(v)}</dd>`).join('')}</dl>${d.aliases?.length?`<p class="small"><strong>Same text also at</strong><br>${d.aliases.map(esc).join('<br>')}</p>`:''}${prev?`<p class="small">Replaces an earlier snapshot · <button class="text-button" data-action="inspect-source" data-source="${prev.id}">view earlier version</button></p>`:''}${next?`<p class="small badge review">A newer snapshot of this file exists · <button class="text-button" data-action="inspect-source" data-source="${next.id}">view newer version</button></p>`:''}${d.warnings?.length?`<div class="info-strip warning">${icon('review')}<span>${d.warnings.map(esc).join('<br>')}</span></div>`:''}${d.segmentStats?`<p class="small muted">${d.segmentStats.count} passages${d.segmentStats.merged?' · '+d.segmentStats.merged+' matched existing material':''}${d.segmentStats.skipped?' · '+d.segmentStats.skipped+' punctuation-only lines skipped':''}</p>`:''}`;}

async function fillDataSection(){const line=$('storage-line');if(!line)return;const est=await S.estimate(),persisted=await navigator.storage?.persisted?.().catch(()=>false);const mb=n=>(n/1048576).toFixed(1)+' MB';line.textContent=(S.mode==='idb'?'Stored in IndexedDB':S.mode==='local'?'Stored in localStorage (limited to a few MB)':'Not stored: this session only')+(est?.usage!=null?' · using '+mb(est.usage)+(est.quota?' of about '+mb(est.quota):''):'')+(persisted?' · protected from automatic eviction':'')+'.';const copies=await S.recoveryCopies(),labels={'legacy-localStorage':'Pre-IndexedDB copy (localStorage)','before-restore':'Before the last restore, reset or blank start','rejected-write':'Change refused because another window saved first',unreadable:'Saved workspace that failed to load'};const el=$('recovery-list');if(el&&copies.length)el.innerHTML='<h3 class="appearance-section-title">Recovery copies</h3>'+copies.map(c=>`<div class="spread small recovery-row"><span>${esc(labels[c.key]||c.key)}<br><span class="muted">${c.at?esc(new Date(c.at).toLocaleString()):''} · ${mb(c.bytes)}</span></span><button class="button secondary small" data-action="download-recovery" data-key="${c.key}">Download</button></div>`).join('');}

document.addEventListener('keydown',e=>{if(e.key!=='Tab'||!selected||innerWidth>1050||$('modal').open)return;const items=[...$('inspector').querySelectorAll('button:not([disabled]),input,textarea,select,summary,a[href]')].filter(el=>!el.closest('details:not([open])')||el.tagName==='SUMMARY');const first=items[0],last=items.at(-1);if(!first)return;if(!e.shiftKey&&(document.activeElement===last||!$('inspector').contains(document.activeElement))){e.preventDefault();first.focus();}else if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus();}});
window.addEventListener('hashchange',()=>applyRoute());
function mergeMotion(from){if(reduceMotion()||$('tray-position').hidden)return;const target=$('tray-target')?.getBoundingClientRect();if(!target?.width)return;const layer=$('water-layer'),drop=document.createElement('i'),receiver=document.createElement('i');drop.className=receiver.className='water-drop';layer.append(drop,receiver);const sx=from.left+from.width/2,sy=from.top+from.height/2,tx=target.left+target.width/2,ty=target.top+target.height/2;receiver.style.cssText=`left:${tx-11}px;top:${ty-11}px;width:22px;height:22px;opacity:.18`;const start=performance.now();function tick(now){const t=Math.min(1,(now-start)/560),v=1-Math.pow(1-t,3),x=sx+(tx-sx)*v,y=sy+(ty-sy)*v-Math.sin(t*Math.PI)*25;drop.style.left=x-9+'px';drop.style.top=y-9+'px';drop.style.transform='scale('+(1+Math.sin(t*Math.PI)*.18-t*.35)+')';drop.style.opacity=String(.4*(1-Math.pow(t,6)));receiver.style.transform='scale('+(1+Math.sin(t*Math.PI)*.24)+')';if(t<1)requestAnimationFrame(tick);else{drop.remove();receiver.remove();}}requestAnimationFrame(tick);}
function refreshLens(rebuild=false){if(rebuild)lensClone=null;if(lensFrame)return;lensFrame=requestAnimationFrame(()=>{lensFrame=0;updateLens();});}
function makeLensMap(w,h){if(!w||!h)return;const size=Math.round(w)+'x'+Math.round(h);if(size===lensSize)return;lensSize=size;const c=document.createElement('canvas');c.width=Math.ceil(w/2);c.height=Math.ceil(h/2);const ctx=c.getContext('2d');if(!ctx)return;const img=ctx.createImageData(c.width,c.height),radius=23;for(let y=0;y<c.height;y++){for(let x=0;x<c.width;x++){const px=x*2,py=y*2,qx=Math.abs(px-w/2)-(w/2-radius),qy=Math.abs(py-h/2)-(h/2-radius),ox=Math.max(qx,0),oy=Math.max(qy,0),len=Math.hypot(ox,oy),sd=len+Math.min(Math.max(qx,qy),0)-radius;let nx=0,ny=0;if(qx>0&&qy>0){nx=ox/(len||1)*Math.sign(px-w/2);ny=oy/(len||1)*Math.sign(py-h/2);}else if(qx>qy)nx=Math.sign(px-w/2);else ny=Math.sign(py-h/2);const a=Math.exp(-Math.max(0,-sd)/6)*.9,i=(y*c.width+x)*4;img.data[i]=128+nx*100*a;img.data[i+1]=128+ny*100*a;img.data[i+2]=128;img.data[i+3]=255;}}ctx.putImageData(img,0,0);$('lens-map').setAttribute('href',c.toDataURL());}
function updateLens(){if(!glassEnabled()||$('tray-position').hidden){$('refracted-scene').replaceChildren();lensClone=null;return;}const body=$('view-body'),tray=$('collection-tray'),br=body.getBoundingClientRect(),tr=tray.getBoundingClientRect();if(!tr.width||!tr.height)return;if(!lensClone){lensClone=body.cloneNode(true);lensClone.removeAttribute('id');lensClone.classList.add('scene-copy');lensClone.setAttribute('aria-hidden','true');lensClone.inert=true;lensClone.querySelectorAll('[id],[data-action],[tabindex]').forEach(el=>{el.removeAttribute('id');el.removeAttribute('data-action');el.setAttribute('tabindex','-1');});$('refracted-scene').replaceChildren(lensClone);}lensClone.style.width=br.width+'px';lensClone.style.transform='translate('+(br.left-tr.left)+'px,'+(br.top-tr.top)+'px)';makeLensMap(tr.width,tr.height);}
$('scroll-port').addEventListener('scroll',()=>refreshLens(),{passive:true});window.addEventListener('resize',()=>{syncInspectorMode();updateSegment();refreshLens(true);});[colorQuery,contrastMoreQuery,contrastLessQuery].forEach(q=>q?.addEventListener?.('change',()=>{applyAppearance();refreshLens(true);}));motionQuery?.addEventListener?.('change',applyAppearance);transparencyQuery?.addEventListener?.('change',()=>{applyAppearance();refreshLens(true);});
document.addEventListener('pointermove',e=>{const glass=e.target.closest('.collection-tray,.sidebar');if(!glass||reduceMotion())return;const rect=glass.getBoundingClientRect();glass.style.setProperty('--light-x',Math.round((e.clientX-rect.left)/rect.width*100)+'%');},{passive:true});
function adoptRemote(json,reason){
 let next;try{next=JSON.parse(json);}catch{return;}if(!M.valid(next))return;
 const keepProject=state.activeProject,active=document.activeElement,blockId=active?.dataset?.editorBlock,caret=blockId?[active.selectionStart,active.selectionEnd]:null;
 state=M.migrate(next);if(state.projects.some(x=>x.id===keepProject&&M.active(x)))state.activeProject=keepProject;
 editorSelection=null;undo=null;if(selected&&!M.object(state,selected.type==='source'?'source':'family',selected.id))selected=null;
 lastHash='';applyRoute(true,false);
 if(blockId){const el=$('text-'+blockId);if(el){el.focus();try{el.setSelectionRange(caret[0],caret[1]);}catch{}}}
 if(reason==='conflict')openModal('Another window saved first','<p>This window was showing an older copy of the workspace, so its most recent change was not written over the newer one.</p><p>This window now shows the saved version. The change that was not applied is kept under <strong>Recovery copies</strong> in Settings.</p>');
 else announce('Updated from another window.');
}
S.on('remote',json=>adoptRemote(json,'remote'));S.on('conflict',json=>adoptRemote(json,'conflict'));
if(S.mode==='local')window.addEventListener('storage',e=>{if(e.key===S.LEGACY_KEY&&e.newValue)adoptRemote(e.newValue,'remote');});
window.addEventListener('beforeunload',e=>{if(S.hasUnsaved()||importRun){S.flush();e.preventDefault();e.returnValue='';}});
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='hidden')S.flush();});
save();applyRoute(true);
if(boot.warning)openModal('Storage notice','<p>'+esc(boot.warning)+'</p><p>Export your workspace from Settings to keep a portable copy.</p>');else if(boot.notice)announce(boot.notice);
};
StudioStore.boot(StudioModel).then(startStudio).catch(err=>{document.body.insertAdjacentHTML('afterbegin','<p style="padding:20px;font:16px system-ui">Studio could not start: '+String(err&&err.message||err).replace(/[<>&]/g,'')+'</p>');console.error(err);});
